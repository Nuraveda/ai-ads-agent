[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ads-agent"
version = "0.1.0"
description = "AI ads agent — Meta + Google + Amazon + LinkedIn campaign automation engine"
authors = [{name = "ai-ads-agent contributors", email = ""}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "asyncpg>=0.30",
  "facebook-business>=21.0",
  "google-ads>=24.0",
  "posthog>=3.7",
  "google-analytics-data>=0.18",
  "python-telegram-bot[rate-limiter,webhooks]>=21.6",
  "langgraph>=0.2",
  "anthropic>=0.40",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ads_agent"]
